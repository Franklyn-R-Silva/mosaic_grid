name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Print versions
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Publish dry-run
        # `pub publish --dry-run` exits non-zero on *any* warning, including a
        # dirty working tree — which says nothing about the package. Show the
        # diff first so that failure arrives with its cause attached instead of
        # an opaque exit 65. (`flutter pub get` rewriting analysis_options.yaml
        # is what triggered this once; those writes are checked in now.)
        run: |
          git --no-pager diff
          flutter pub publish --dry-run
