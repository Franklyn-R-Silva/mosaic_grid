# The analyzer block is checked in deliberately: `flutter pub get` (SDK 3.47+)
# writes it itself, which left the working tree dirty in CI and failed the
# publish dry-run. Keeping it here makes that write a no-op.
analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
include: package:flutter_lints/flutter.yaml
